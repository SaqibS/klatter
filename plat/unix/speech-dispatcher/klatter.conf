# Klatter for Speech Dispatcher: Orca and every program that speaks through
# Speech Dispatcher can use it. install.sh puts this file in Speech Dispatcher's
# modules folder and adds Klatter to speechd.conf:
#
#   AddModule "klatter" "sd_generic" "klatter.conf"
#
# Speech Dispatcher runs klatter for each thing it says, with its own rate,
# pitch and volume (-100 to 100). Klatter has nothing to load, so it starts
# speaking at once, and stopping it ends the process. Klatter's other settings
# (base rate in words per minute, base pitch, flutter, every voice-quality
# setting, dictionaries, sample rate) come from ~/.config/klatter/klatter.conf.

GenericExecuteSynth "printf %s \'$DATA\' | @KLATTER@ --sd-rate $RATE --sd-pitch $PITCH --sd-volume $VOLUME"

GenericCmdDependency "@KLATTER@"

# Speech Dispatcher gives a generic module its rate, pitch and volume as -1 to 1;
# times 100 they are its own -100 to 100, which klatter scales.
GenericRateAdd 0
GenericRateMultiply 100
GenericRateForceInteger 1
GenericPitchAdd 0
GenericPitchMultiply 100
GenericPitchForceInteger 1
GenericVolumeAdd 0
GenericVolumeMultiply 100
GenericVolumeForceInteger 1

# Klatter reads punctuation itself, so only square brackets are taken out.
# Speech Dispatcher refuses an empty value here.
GenericStripPunctChars "[]"

GenericLanguage "en" "en" "utf-8"
GenericLanguage "en-US" "en" "utf-8"

# Klatter has one voice; it answers to both of Speech Dispatcher's main types.
AddVoice "en" "MALE1" "klatter"
AddVoice "en" "FEMALE1" "klatter"

DefaultVoice "klatter"
